name: Daily Multi-Source Sync

on:
  schedule:
    # Runs every day at 00:00 UTC (midnight)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering anytime from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Multi-Source Sync Engine
        run: python3 scripts/sync-data.py

      - name: Commit and Push if updated
        run: |
          git config user.name "saitarrun"
          git config user.email "saitarrunpitta@gmail.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No changes detected in upstream datasets."
          else
            git commit -m "Auto-sync: update company problems and patterns [daily-cron]"
            git push origin main
          fi
