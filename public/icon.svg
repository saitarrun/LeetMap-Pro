<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#10B981" flood-opacity="0.55" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#27272A" stroke-width="3" opacity="0.6" />
  
  <!-- Outer Ring Radar Grid -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#27272A" stroke-width="12" stroke-dasharray="16 12"/>
  
  <!-- Dynamic Compass Needle with Faceted Shading -->
  <!-- Top Right Half (Pointing North in Emerald) -->
  <polygon points="256,106 336,256 256,236" fill="url(#emGrad)" filter="url(#glow)" />
  <!-- Bottom Left Half (Pointing South in Crisp White) -->
  <polygon points="256,406 176,256 256,276" fill="#FFFFFF" />
  <!-- Top Left Wing (Light Mint Highlight) -->
  <polygon points="256,106 256,236 176,256" fill="#A7F3D0" />
  <!-- Bottom Right Wing (Soft Silver Shadow) -->
  <polygon points="256,406 256,276 336,256" fill="#94A3B8" />
  
  <!-- Central Waypoint Pivot Point -->
  <circle cx="256" cy="256" r="22" fill="#09090B" stroke="#FFFFFF" stroke-width="8"/>
</svg>